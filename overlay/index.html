<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="panel">
        <div class="header">
            <div class="title">🌸 Community Tasks 🌸</div>
            <div class="counter" id="counter">0 / 0</div>
        </div>
        <div class="tasks" id="taskList">
            <!-- Tasks generated by JavaScript -->
        </div>
        <div class="footer">
            <div class="footer-title">🍀 Commands 🍀</div>
            <div class="command">
                <span class="command-name">!task [description]</span>
                <span class="command-description">- add your task (ex: !task Study)</span>
            </div>
            <div class="command">
                <span class="command-name">!done</span>
                <span class="command-description">- complete your oldest task</span>
            </div>
            <div class="command">
                <span class="command-name">!done [task id]</span>
                <span class="command-description">- complete youe task by number (ex: !done 2)</span>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
 </body>
</html>
