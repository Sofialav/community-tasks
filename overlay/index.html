<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Tasks</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="panel" id="panel">
        <div class="header">
            <div class="title" id="title">🌸 Community Tasks 🌸</div>
            <div class="counter" id="counter">0 / 0</div>
        </div>

        <div class="status" id="status" hidden>
            <span class="status-dot"></span>
            <span id="statusText">Connecting to Streamer.bot…</span>
        </div>

        <div class="tasks" id="taskList"></div>

        <div class="empty" id="empty" hidden>
            No tasks yet. Type <span class="command-name">!task</span> to add yours!
        </div>

        <!-- Edit the command list freely; it is plain HTML. -->
        <div class="footer" id="footer">
            <div class="footer-title">🌿 Commands 🌿</div>
            <div class="command">
                <span class="command-name">!task [description]</span>
                <span class="command-description">add your task (ex: !task Study)</span>
            </div>
            <div class="command">
                <span class="command-name">!done</span>
                <span class="command-description">complete your oldest task</span>
            </div>
            <div class="command">
                <span class="command-name">!done [task id]</span>
                <span class="command-description">complete your task by number (ex: !done 2)</span>
            </div>
            <div class="command" id="extraCommands" hidden>
                <span class="command-name" id="extraText"></span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
